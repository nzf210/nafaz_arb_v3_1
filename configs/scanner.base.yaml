engine:
  tick_interval_ms: 1000
  signal_validity_ms: 2500
  dedup_cooldown_sec: 300
  min_yield_delta: 0.005
  dry_run: true
  redis_addr: "127.0.0.1:6379"

freshness:
  max_book_age_ms: 2500
  max_funding_age_sec: 120
  max_collateral_age_sec: 7200

route_policies:
  enable_spot_perp_same_cex: true
  enable_perp_perp_cross_cex: true
  enable_spot_perp_cross_cex: false
  min_collateral_ratio: 0.85

profiles:
  - id: "funding_carry_core"
    target_notional_usdt: 20.0
    target_hold_days: 7.0
    max_breakeven_days: 2.5
    min_net_daily_yield: 0.0010
    min_volume_24h_usdt: 5000000.0
    max_initial_basis_spread: 0.005
  - id: "basis_convergence_fast"
    target_notional_usdt: 20.0
    target_hold_days: 1.0
    max_breakeven_days: 0.8
    min_net_daily_yield: 0.0015
    min_volume_24h_usdt: 5000000.0
    max_initial_basis_spread: 0.010
