name: NAFAZ ARB CI

on:
  push:
    branches:
      - master
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-tests:
    name: Go scanner tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: scanner-go/go.sum
      - name: Run Go tests
        working-directory: scanner-go
        run: go test ./...

  python-tests:
    name: Python executor tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test/runtime dependencies
        run: python -m pip install --upgrade pytest ccxt redis pyyaml "psycopg[binary]"
      - name: Run Python tests
        working-directory: executor-py
        env:
          PYTHONPATH: .
        run: pytest -q
